name: Build Telegram APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: platform-tools

      - name: Install Android requirements
        run: |
          sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Configure Telegram API
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          api_id = os.environ.get("TELEGRAM_API_ID", "")
          api_hash = os.environ.get("TELEGRAM_API_HASH", "")

          if not api_id.isdigit() or not api_hash:
              raise SystemExit("Telegram API secrets are missing or invalid")

          path = Path("TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java")
          source = path.read_text()

          source, count_id = re.subn(
              r'public static int APP_ID = \d+;',
              f'public static int APP_ID = {api_id};',
              source,
              count=1
          )

          source, count_hash = re.subn(
              r'public static String APP_HASH = "[^"]*";',
              'public static String APP_HASH = "' + api_hash + '";',
              source,
              count=1
          )

          if count_id != 1 or count_hash != 1:
              raise SystemExit("Could not find the expected API settings")

          path.write_text(source)
          print("Telegram API settings configured successfully")
          PY

      - name: Build standalone APK
        run: |
          chmod +x gradlew
          ./gradlew :TMessagesProj_AppStandalone:assembleAfatStandalone

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Telegram-Standalone-APK
          path: TMessagesProj_AppStandalone/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 7
